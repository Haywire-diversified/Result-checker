<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management Tables</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        /* Tab Navigation Styles */
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab-button {
            background-color: #ddd;
            border: none;
            outline: none;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            margin: 0 5px;
            border-radius: 5px 5px 0 0;
        }
        .tab-button:hover {
            background-color: #ccc;
        }
        .tab-button.active {
            background-color: #007bff;
            color: white;
        }

        /* Tab Content Styles */
        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 100%;
            overflow-x: auto;
        }
        .tab-content.active {
            display: block;
        }

        /* Toolbar Styles */
        .toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #28a745;
            color: white;
            transition: background 0.2s;
        }
        .toolbar button.delete-col-btn {
            background-color: #dc3545;
        }
        .toolbar button:hover {
            opacity: 0.9;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            min-width: 100px;
        }
        th {
            background-color: #f8f9fa;
            position: relative;
        }
        td[contenteditable="true"]:focus {
            background-color: #eef9ff;
            outline: 2px solid #007bff;
        }
        .action-cell {
            text-align: center;
            min-width: 60px;
        }
        .delete-row-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-row-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

    <h2>Course Record Sheets</h2>

    <!-- Tab Buttons -->
    <div class="tab-container">
        <button class="tab-button active" onclick="openTab(event, 'course1')">Course 1</button>
        <button class="tab-button" onclick="openTab(event, 'course2')">Course 2</button>
        <button class="tab-button" onclick="openTab(event, 'course3')">Course 3</button>
    </div>

    <!-- Course 1 Tab Content -->
    <div id="course1" class="tab-content active">
        <h3>Course 1 Management</h3>
        <div class="toolbar">
            <button onclick="addRow('table1', 'course1')">➕ Add Row</button>
            <button onclick="addColumn('table1', 'course1')">➕ Add Column</button>
            <button class="delete-col-btn" onclick="deleteLastColumn('table1', 'course1')">➖ Delete Last Column</button>
            <button onclick="saveData('course1', 'table1')" style="background-color: #17a2b8;">💾 Save Changes</button>
        </div>
        <table id="table1">
            <thead>
                <tr>
                    <th contenteditable="true">Matric No</th>
                    <th contenteditable="true">Student Name</th>
                    <th contenteditable="true">Score</th>
                    <th class="action-cell">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows injected dynamically via JS or loaded from storage -->
            </tbody>
        </table>
    </div>

    <!-- Course 2 Tab Content -->
    <div id="course2" class="tab-content">
        <h3>Course 2 Management</h3>
        <div class="toolbar">
            <button onclick="addRow('table2', 'course2')">➕ Add Row</button>
            <button onclick="addColumn('table2', 'course2')">➕ Add Column</button>
            <button class="delete-col-btn" onclick="deleteLastColumn('table2', 'course2')">➖ Delete Last Column</button>
            <button onclick="saveData('course2', 'table2')" style="background-color: #17a2b8;">💾 Save Changes</button>
        </div>
        <table id="table2">
            <thead>
                <tr>
                    <th contenteditable="true">Matric No</th>
                    <th contenteditable="true">Student Name</th>
                    <th contenteditable="true">Score</th>
                    <th class="action-cell">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows injected dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Course 3 Tab Content -->
    <div id="course3" class="tab-content">
        <h3>Course 3 Management</h3>
        <div class="toolbar">
            <button onclick="addRow('table3', 'course3')">➕ Add Row</button>
            <button onclick="addColumn('table3', 'course3')">➕ Add Column</button>
            <button class="delete-col-btn" onclick="deleteLastColumn('table3', 'course3')">➖ Delete Last Column</button>
            <button onclick="saveData('course3', 'table3')" style="background-color: #17a2b8;">💾 Save Changes</button>
        </div>
        <table id="table3">
            <thead>
                <tr>
                    <th contenteditable="true">Matric No</th>
                    <th contenteditable="true">Student Name</th>
                    <th contenteditable="true">Score</th>
                    <th class="action-cell">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        // Switch between tabs
        function openTab(evt, courseName) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) {
                contents[i].classList.remove("active");
            }

            const buttons = document.getElementsByClassName("tab-button");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }

            document.getElementById(courseName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        // Add a new row to the specified table
        function addRow(tableId, storageKey, rowData = null) {
            const table = document.getElementById(tableId).getElementsByTagName('tbody')[0];
            const headerCount = document.getElementById(tableId).rows[0].cells.length;
            const newRow = table.insertRow();

            for (let i = 0; i < headerCount - 1; i++) {
                const newCell = newRow.insertCell();
                newCell.contentEditable = "true";
                newCell.innerText = rowData ? (rowData[i] || "") : "";
            }

            // Action cell with delete button
            const actionCell = newRow.insertCell();
            actionCell.className = "action-cell";
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-row-btn";
            deleteBtn.innerText = "X";
            deleteBtn.onclick = function () {
                newRow.remove();
                saveData(storageKey, tableId);
            };
            actionCell.appendChild(deleteBtn);
        }

        // Add a new column to the specified table
        function addColumn(tableId, storageKey) {
            const table = document.getElementById(tableId);
            const headerRow = table.rows[0];
            
            // Insert header before the last column (Action column)
            const newTh = document.createElement("th");
            newTh.contentEditable = "true";
            newTh.innerText = "New Column";
            headerRow.insertBefore(newTh, headerRow.cells[headerRow.cells.length - 1]);

            // Insert cells for each row before the action cell
            const tbody = table.getElementsByTagName('tbody')[0];
            for (let i = 0; i < tbody.rows.length; i++) {
                const row = tbody.rows[i];
                const newCell = row.insertCell(row.cells.length - 1);
                newCell.contentEditable = "true";
                newCell.innerText = "";
            }
            saveData(storageKey, tableId);
        }

        // Delete the last data column
        function deleteLastColumn(tableId, storageKey) {
            const table = document.getElementById(tableId);
            const headerRow = table.rows[0];
            
            // Ensure we don't delete essential columns (keep at least Matric No, Name, and Action)
            if (headerRow.cells.length <= 4) {
                alert("Cannot delete primary columns!");
                return;
            }

            // Remove header cell just before action cell
            headerRow.deleteCell(headerRow.cells.length - 2);

            // Remove corresponding cells from body rows
            const tbody = table.getElementsByTagName('tbody')[0];
            for (let i = 0; i < tbody.rows.length; i++) {
                const row = tbody.rows[i];
                row.deleteCell(row.cells.length - 2);
            }
            saveData(storageKey, tableId);
        }

        // Save table data to browser LocalStorage
        function saveData(storageKey, tableId) {
            const table = document.getElementById(tableId);
            const headers = [];
            const headerCells = table.rows[0].cells;
            
            for (let i = 0; i < headerCells.length - 1; i++) {
                headers.push(headerCells[i].innerText);
            }

            const rows = [];
            const tbody = table.getElementsByTagName('tbody')[0];
            for (let i = 0; i < tbody.rows.length; i++) {
                const row = tbody.rows[i];
                const rowData = [];
                for (let j = 0; j < row.cells.length - 1; j++) {
                    rowData.push(row.cells[j].innerText);
                }
                rows.push(rowData);
            }

            const data = { headers, rows };
            localStorage.setItem(storageKey, JSON.stringify(data));
            alert("Changes saved successfully!");
        }

        // Load data on page startup
        function loadData(storageKey, tableId) {
            const savedData = localStorage.getItem(storageKey);
            const table = document.getElementById(tableId);
            const headerRow = table.rows[0];
            const tbody = table.getElementsByTagName('tbody')[0];

            if (savedData) {
                const data = JSON.parse(savedData);
                
                // Rebuild Headers
                headerRow.innerHTML = "";
                data.headers.forEach(headerText => {
                    const th = document.createElement("th");
                    th.contentEditable = "true";
                    th.innerText = headerText;
                    headerRow.appendChild(th);
                });
                const actionTh = document.createElement("th");
                actionTh.className = "action-cell";
                actionTh.innerText = "Action";
                headerRow.appendChild(actionTh);

                // Rebuild Rows
                tbody.innerHTML = "";
                data.rows.forEach(rowData => {
                    addRow(tableId, storageKey, rowData);
                });
            } else {
                // Default initial row if empty
                addRow(tableId, storageKey, ["", "", ""]);
            }
        }

        // Initialize tables on load
        window.onload = function() {
            loadData('course1', 'table1');
            loadData('course2', 'table2');
            loadData('course3', 'table3');
        };
    </script>
</body>
</html>
